name: Build APK

on:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ke HP
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-APK
          path: app/build/outputs/apk/debug/*.apk
