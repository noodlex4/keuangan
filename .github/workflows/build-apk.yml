name: Ubah HTML Jadi APK

on:
  workflow_dispatch: # Biar bisa diklik manual dari HP

jobs:
  convert-to-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode HTML & CSS Kamu
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js (Mesin Pembungkus)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Siapkan Java (Mesin Android)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Install Tool Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 5. Konfigurasi Nama Aplikasi
        # Kamu bisa ganti "Aplikasi Webku" dengan nama aplikasi yang kamu mau
        run: npx cap init "Aplikasi Webku" "com.kamu.myapp" --web-dir=.

      - name: 6. Rakit Sistem Android
        run: |
          npx cap add android
          npx cap sync android

      - name: 7. Compile Jadi File APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Kirim File APK ke HP
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-HTML-Kamu
          path: android/app/build/outputs/apk/debug/*.apk
