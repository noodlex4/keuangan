```yaml
name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # Otomatis jalan saat kamu upload kode
  workflow_dispatch: # Membuat tombol biar bisa di-klik manual dari HP

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Kode dari Repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Beri Izin Akses Gradle
      run: chmod +x gradlew

    - name: Proses Ubah Kode Jadi APK
      run: ./gradlew assembleDebug

    - name: Simpan File APK Hasil Build
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Android-Kamu
        path: app/build/outputs/apk/debug/*.apk
