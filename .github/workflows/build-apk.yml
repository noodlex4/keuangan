name: Ubah HTML Jadi APK (Final Fix)

on:
  workflow_dispatch:

jobs:
  convert-to-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode HTML & CSS Kamu
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Siapkan Java 17 (Wajib untuk Gradle Capacitor)
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Kita turunkan lagi ke 17 agar pas dengan sistemnya
          distribution: 'temurin'

      - name: 4. Amankan File HTML & CSS ke Folder Bersih
        run: |
          mkdir www
          cp index.html www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          cp *.js *.png *.jpg *.jpeg www/ 2>/dev/null || true

      - name: 5. Install Tool Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 6. Buat Konfigurasi Aplikasi
        run: |
          echo '{
            "appId": "com.kamu.myapp",
            "appName": "Aplikasi Webku",
            "webDir": "www"
          }' > capacitor.config.json

      - name: 7. Rakit Sistem Android & Sinkronisasi
        run: |
          npx cap add android
          npx cap sync android

      - name: 8. Compile Jadi File APK
        # Kita tambahkan --no-daemon biar server rakitnya pelan tapi pasti tanpa putus tengah jalan
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Kirim File APK ke HP
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-HTML-Kamu
          path: android/app/build/outputs/apk/debug/*.apk
